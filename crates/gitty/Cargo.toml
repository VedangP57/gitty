[package]
name = "gitty"
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "A fast terminal git client with the GitHub Desktop experience"
readme = "../../README.md"
keywords = ["git", "tui", "terminal", "diff", "ratatui"]
categories = ["command-line-utilities", "development-tools"]

[features]
default = ["grammars"]
# bundled tree-sitter grammars; without them every language uses the syntect fallback
grammars = ["gitty-highlight/default"]

[dependencies]
gitty-core = { path = "../gitty-core", version = "0.1.0" }
gitty-highlight = { path = "../gitty-highlight", version = "0.1.0", default-features = false }
anyhow.workspace = true
ratatui = { version = "0.30", default-features = false, features = ["crossterm_0_29", "underline-color", "layout-cache"] }
crossterm = "0.29"
crossbeam-channel = "0.5"
serde = { version = "1", features = ["derive"] }
toml = { version = "0.9", features = ["preserve_order"] }
unicode-width = "0.2"
unicode-segmentation = "1"
libc = "0.2"
signal-hook = "0.3"

[dev-dependencies]
insta = "1"
tempfile = "3"
criterion = "0.8"

[[bench]]
name = "frame"
harness = false
