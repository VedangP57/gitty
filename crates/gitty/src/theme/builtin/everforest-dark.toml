# Everforest dark, medium background (sainnhe/everforest).
name = "everforest-dark"
kind = "dark"

[palette]
bg = "#2d353b"
panel = "#232a2e"
fg = "#d3c6aa"
muted = "#859289"
accent = "#a7c080"
border = "#475258"
red = "#e67e80"
green = "#a7c080"
yellow = "#dbbc7f"
blue = "#7fbbb3"
magenta = "#d699b6"
cyan = "#83c092"
orange = "#e69875"

[syntax]
keyword = "#e67e80"
string = "#a7c080"
comment = { fg = "#859289", italic = true }
function = "#a7c080"
type = "#dbbc7f"
constant = "#83c092"
number = "#d699b6"
operator = "#e69875"
variable = "fg"
property = "#7fbbb3"
punctuation = "#9da9a0"
attribute = "#d699b6"
tag = "#e69875"
label = "#e69875"
module = "#83c092"
constructor = "#dbbc7f"
macro = "#d699b6"
escape = "#e69875"
embedded = "fg"
