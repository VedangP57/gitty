# Ayu Mirage (ayu-theme/ayu-colors).
name = "ayu-mirage"
kind = "dark"

[palette]
bg = "#242936"
panel = "#1f2430"
fg = "#cccac2"
muted = "#707a8c"
accent = "#ffcc66"
border = "#2b4768"
red = "#f28779"
green = "#87d96c"
yellow = "#ffcd66"
blue = "#73d0ff"
magenta = "#dfbfff"
cyan = "#95e6cb"
orange = "#ffa659"

[syntax]
keyword = "#ffa659"
string = "#d5ff80"
comment = { fg = "#6e7c8f", italic = true }
function = "#ffcd66"
type = "#73d0ff"
constant = "#dfbfff"
number = "#dfbfff"
operator = "#f29e74"
variable = "fg"
property = "fg"
punctuation = "fg"
attribute = "#d9be98"
tag = "#5ccfe6"
label = "#ffa659"
module = "#73d0ff"
constructor = "#73d0ff"
macro = "#f28779"
escape = "#95e6cb"
embedded = "fg"
