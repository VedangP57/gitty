# One Dark (Atom One Dark syntax; palette as in joshdick/onedark.vim).
name = "one-dark"
kind = "dark"

[palette]
bg = "#282c34"
panel = "#2c323c"
fg = "#abb2bf"
muted = "#828997"
accent = "#61afef"
border = "#3e4452"
red = "#e06c75"
green = "#98c379"
yellow = "#e5c07b"
blue = "#61afef"
magenta = "#c678dd"
cyan = "#56b6c2"
orange = "#d19a66"

[syntax]
keyword = "#c678dd"
string = "#98c379"
comment = { fg = "#5c6370", italic = true }
function = "#61afef"
type = "#e5c07b"
constant = "#d19a66"
number = "#d19a66"
operator = "#56b6c2"
variable = "#e06c75"
property = "#e06c75"
punctuation = "fg"
attribute = "#d19a66"
tag = "#e06c75"
label = "#61afef"
module = "#e5c07b"
constructor = "#e5c07b"
macro = "#56b6c2"
escape = "#56b6c2"
embedded = "fg"
