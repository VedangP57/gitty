# Tokyo Night Day (folke/tokyonight.nvim).
name = "tokyo-night-day"
kind = "light"

[palette]
bg = "#e1e2e7"
panel = "#d0d5e3"
fg = "#3760bf"
muted = "#68709a"
accent = "#2e7de9"
border = "#b4b5b9"
red = "#c64343"
green = "#587539"
yellow = "#8c6c3e"
blue = "#2e7de9"
magenta = "#9854f1"
cyan = "#007197"
