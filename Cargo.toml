[workspace]
resolver = "3"
members = ["crates/gitty-core", "crates/gitty-highlight", "crates/gitty"]

[workspace.package]
edition = "2024"
version = "0.1.2"
license = "MIT"
rust-version = "1.90"
authors = ["Vedang Patel"]
repository = "https://github.com/VedangP57/gitty"
homepage = "https://github.com/VedangP57/gitty"

[workspace.dependencies]
gix = { version = "0.88", features = ["anyhow"] }
anyhow = "1"
thiserror = "2"
smallvec = "1"

[profile.release]
lto = "thin"
codegen-units = 1
debug = 1

[profile.bench]
lto = "thin"
codegen-units = 1
debug = 1

# The profile that 'dist' builds release archives with: no debug info, so
# the shipped binary stays small.
[profile.dist]
inherits = "release"
debug = false
strip = true
